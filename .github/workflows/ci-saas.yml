name: CI (Auto)

on:
  push:
    branches:
      - self-hosted
  pull_request:
    branches:
      - self-hosted
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect_edition:
    name: Detect edition
    if: (github.event_name != 'workflow_dispatch' || github.ref_name == 'self-hosted') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      edition: ${{ steps.detect.outputs.edition }}
      saas_enabled: ${{ steps.detect.outputs.saas_enabled }}
    steps:
      - name: Resolve branch CI mode
        id: detect
        shell: bash
        env:
          FIZZY_EDITION: ${{ vars.FIZZY_EDITION || '' }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          BASE_REF: ${{ github.base_ref || '' }}
        run: |
          set -euo pipefail

          edition="$(printf '%s' "${FIZZY_EDITION:-}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "$edition" ]; then
            if [ "$BASE_REF" = "self-hosted" ] || [ "$REF_NAME" = "self-hosted" ]; then
              edition="oss"
            elif [ "$REPOSITORY" = "basecamp/fizzy" ]; then
              edition="saas"
            else
              edition="oss"
            fi
          fi

          case "$edition" in
            oss|self-hosted)
              printf 'edition=oss\n' >> "$GITHUB_OUTPUT"
              printf 'saas_enabled=false\n' >> "$GITHUB_OUTPUT"
              ;;
            saas)
              printf 'edition=saas\n' >> "$GITHUB_OUTPUT"
              printf 'saas_enabled=true\n' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported FIZZY_EDITION '$edition'. Use 'oss' or 'saas'." >&2
              exit 64
              ;;
          esac

  test_oss:
    name: Test (OSS)
    needs: detect_edition
    uses: ./.github/workflows/test.yml
    with:
      saas: false
      include_mysql: ${{ needs.detect_edition.outputs.edition == 'saas' }}
  test_saas:
    name: Test (SaaS)
    needs: detect_edition
    if: needs.detect_edition.outputs.saas_enabled == 'true'
    uses: ./.github/workflows/test.yml
    with:
      saas: true
      include_mysql: true
    secrets:
      FIZZY_GH_TOKEN: ${{ secrets.FIZZY_GH_TOKEN }}
