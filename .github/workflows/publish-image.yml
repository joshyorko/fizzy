name: Build and publish container image to GHCR

on:
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_DESCRIPTION: Fizzy is Kanban as it should be. Not as it has been.
  SOURCE_URL: https://github.com/${{ github.repository }}

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    outputs:
      canonical: ${{ steps.vars.outputs.canonical }}
      short_sha: ${{ steps.vars.outputs.short_sha }}
    steps:
      - name: Compute canonical image name and release tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME:-$GITHUB_REPOSITORY}"
          canonical_image="${REGISTRY}/${image_ref,,}"
          echo "canonical=${canonical_image}" >> "$GITHUB_OUTPUT"
          echo "short_sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and push amd64 image with Kamal
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      VERSION_INPUT: ${{ needs.prepare.outputs.short_sha }}
      KAMAL_REGISTRY_PASSWORD: ${{ github.token }}
      KAMAL_SERVER_ALIAS: ${{ secrets.KAMAL_SERVER_ALIAS || vars.KAMAL_SERVER_ALIAS }}
      KAMAL_PUBLIC_HOST: ${{ secrets.KAMAL_PUBLIC_HOST || vars.KAMAL_PUBLIC_HOST }}
      KAMAL_SSH_USER: ${{ secrets.KAMAL_SSH_USER || vars.KAMAL_SSH_USER }}
      KAMAL_STORAGE_PATH: ${{ secrets.KAMAL_STORAGE_PATH || vars.KAMAL_STORAGE_PATH }}
      KAMAL_MAILER_FROM_ADDRESS: ${{ secrets.KAMAL_MAILER_FROM_ADDRESS || vars.KAMAL_MAILER_FROM_ADDRESS }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT || vars.S3_ENDPOINT }}
      S3_BUCKET: ${{ secrets.S3_BUCKET || vars.S3_BUCKET }}
      KAMAL_SKIP_SSH_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx for cache
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Expose GitHub Runtime for cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          bundler-cache: true

      - name: Build and push image with Kamal
        shell: bash
        run: |
          set -euo pipefail
          bundle exec kamal build push --version "$VERSION_INPUT"

  deploy:
    name: Handoff to Kamal deploy
    needs:
      - prepare
      - build
    uses: ./.github/workflows/deploy-self-hosted.yml
    permissions:
      contents: read
      packages: read
    with:
      action: deploy
      version: ${{ needs.prepare.outputs.short_sha }}
    secrets: inherit # zizmor: ignore[secrets-inherit] -- deploy workflow consumes the repo deploy secret set
