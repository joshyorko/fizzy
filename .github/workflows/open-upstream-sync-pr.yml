name: Open PR from upstream into self-hosted

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: open-upstream-sync-pr
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  open_pr:
    runs-on: ubuntu-latest
    env:
      SYNC_BRANCH: codex/upstream-main-sync
      UPSTREAM_REMOTE: upstream
      UPSTREAM_REPO_URL: https://github.com/basecamp/fizzy.git
      UPSTREAM_BRANCH: main
      TARGET_BRANCH: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch target and upstream branches
        shell: bash
        run: |
          set -euo pipefail
          git remote add "$UPSTREAM_REMOTE" "$UPSTREAM_REPO_URL" 2>/dev/null || git remote set-url "$UPSTREAM_REMOTE" "$UPSTREAM_REPO_URL"
          git fetch origin "$TARGET_BRANCH"
          git fetch origin "$SYNC_BRANCH" || true
          git fetch "$UPSTREAM_REMOTE" "$UPSTREAM_BRANCH"

      - name: Create or refresh PR from upstream into self-hosted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          existing_pr="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base "$TARGET_BRANCH" \
            --head "$SYNC_BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number')"

          if git diff --quiet "origin/$TARGET_BRANCH...$UPSTREAM_REMOTE/$UPSTREAM_BRANCH"; then
            if [ -n "$existing_pr" ]; then
              gh pr close "$existing_pr" \
                --repo "$GITHUB_REPOSITORY" \
                --comment "Closing because \`$UPSTREAM_REMOTE/$UPSTREAM_BRANCH\` and \`$TARGET_BRANCH\` no longer differ."
            fi

            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SYNC_BRANCH" >/dev/null 2>&1; then
              gh api \
                --method DELETE \
                "repos/$GITHUB_REPOSITORY/git/refs/heads/$SYNC_BRANCH"
            fi
            exit 0
          fi

          target_ref="origin/$TARGET_BRANCH"
          upstream_ref="$UPSTREAM_REMOTE/$UPSTREAM_BRANCH"
          upstream_sha="$(git rev-parse "$UPSTREAM_REMOTE/$UPSTREAM_BRANCH")"
          target_sha="$(git rev-parse "$target_ref")"
          merge_base="$(git merge-base "$target_ref" "$upstream_ref")"
          upstream_commits="$(git rev-list --count "$target_ref..$upstream_ref")"
          downstream_commits="$(git rev-list --count "$upstream_ref..$target_ref")"

          mode="merge-candidate"
          title="[codex] merge upstream main into self-hosted"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --force -B "$SYNC_BRANCH" "$target_ref"
          if git merge --no-edit --no-ff "$upstream_ref"; then
            sync_sha="$(git rev-parse HEAD)"
          else
            mode="conflict-alert"
            title="[codex] upstream main differs from self-hosted (conflicts)"
            git diff --name-only --diff-filter=U | sort > /tmp/upstream-sync-conflicts.txt

            : > /tmp/upstream-sync-conflicts.md
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              printf -- '- `%s`\n' "$file" >> /tmp/upstream-sync-conflicts.md
            done < /tmp/upstream-sync-conflicts.txt

            if [ ! -s /tmp/upstream-sync-conflicts.md ]; then
              printf -- '- Git did not report unmerged paths.\n' > /tmp/upstream-sync-conflicts.md
            fi

            git merge --abort || git reset --hard "$target_ref"
            git checkout --force -B "$SYNC_BRANCH" "$upstream_ref"
            sync_sha="$upstream_sha"
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"

          cat > /tmp/upstream-sync-pr.md <<EOF
          This automated PR alerts you that \`$UPSTREAM_REMOTE/$UPSTREAM_BRANCH\` has changed and now differs from \`$TARGET_BRANCH\`.

          The PR head branch is disposable. Closing this PR will not remove your long-lived deployment branch.

          Change context:
          - Upstream source: \`$UPSTREAM_REPO_URL\`
          - Upstream branch: \`$UPSTREAM_BRANCH\`
          - PR head branch: \`$SYNC_BRANCH\`
          - Target branch: \`$TARGET_BRANCH\`
          - Target SHA: \`$target_sha\`
          - Upstream SHA: \`$upstream_sha\`
          - Merge base: \`$merge_base\`
          - PR head SHA: \`$sync_sha\`
          - Mode: \`$mode\`
          - Upstream commits not in target: \`$upstream_commits\`
          - Downstream commits not in upstream: \`$downstream_commits\`
          EOF

          if [ "$mode" = "merge-candidate" ]; then
            cat >> /tmp/upstream-sync-pr.md <<EOF

          Merge probe:
          - A clean merge candidate was created from \`$TARGET_BRANCH\` plus \`$UPSTREAM_REMOTE/$UPSTREAM_BRANCH\`.
          - The self-hosted CI profile and checks were dispatched for \`$SYNC_BRANCH\`.

          EOF
          else
            cat >> /tmp/upstream-sync-pr.md <<EOF

          Merge probe:
          - A clean merge candidate could not be created automatically.
          - The PR branch is raw upstream as a conflict alert, so GitHub checks may reflect upstream/SaaS state instead of the self-hosted profile.
          - Resolve from a branch based on \`$TARGET_BRANCH\`, merge \`$UPSTREAM_REMOTE/$UPSTREAM_BRANCH\`, then run the self-hosted/OSS profile after conflicts are resolved.

          Conflict files:
          EOF

            cat /tmp/upstream-sync-conflicts.md >> /tmp/upstream-sync-pr.md

            cat >> /tmp/upstream-sync-pr.md <<EOF

          EOF
          fi

          cat >> /tmp/upstream-sync-pr.md <<EOF

          Review focus:
          - upstream app changes that conflict with the self-hosted Kamal path
          - migrations, dependencies, or env changes that alter deployment assumptions
          - workflow changes worth porting separately into \`$TARGET_BRANCH\`
          EOF

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body-file /tmp/upstream-sync-pr.md
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$TARGET_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "$title" \
              --body-file /tmp/upstream-sync-pr.md \
              --draft
          fi

          if [ "$mode" = "merge-candidate" ]; then
            gh workflow run ci-saas.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
            gh workflow run ci-checks.yml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
          fi
