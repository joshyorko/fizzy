name: CI (OSS)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - self-hosted
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: (github.event_name == 'workflow_dispatch' && github.ref_name == 'self-hosted') || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/test.yml
    with:
      saas: false
      include_mysql: ${{ github.ref_name != 'self-hosted' }}
