[extend]
useDefault = true

[allowlist]
paths = [
  '''log''',
  '''tmp''',
  '''.*\.yml\.enc''',
  '''^\.env\.kamal\.local$''',
  '''docs/''',
  '''test/''',
]

regexes = [
  '''\$\{\{\s*secrets\.[A-Z0-9_]+\s*\|\|\s*vars\.[A-Z0-9_]+\s*\}\}''',
]

stopwords = [
  "secrets.S3_BUCKET",
  "vars.S3_BUCKET",
]

[[rules]]
id = "basecamp-integration-url"
description = "Basecamp Integration URL"
regex = '''https://[^\s]*?([0-9a-fA-F]{16,})'''
[rules.allowlist]
regexTarget = "match"
regexes = ['''github\.com''']
